# ─── Canonical: blackdelta.cc ───────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name blackdelta.cc;
  server_tokens off;

  # Block direct IP access — only Cloudflare-proxied traffic allowed
  if ($http_cf_connecting_ip = "") { return 444; }

  location / {
    proxy_pass http://127.0.0.1:3030;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name blackdelta.cc;
  server_tokens off;

  ssl_certificate     /etc/nginx/ssl/blackdelta-cert.pem;
  ssl_certificate_key /etc/nginx/ssl/blackdelta-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  if ($http_cf_connecting_ip = "") { return 444; }

  location / {
    proxy_pass http://127.0.0.1:3030;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }
}

# ─── Redirect www.blackdelta.cc → blackdelta.cc ────────
server {
  listen 80;
  listen [::]:80;
  server_name www.blackdelta.cc;
  if ($http_cf_connecting_ip = "") { return 444; }
  return 301 https://blackdelta.cc$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.blackdelta.cc;
  ssl_certificate     /etc/nginx/ssl/blackdelta-cert.pem;
  ssl_certificate_key /etc/nginx/ssl/blackdelta-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  if ($http_cf_connecting_ip = "") { return 444; }
  return 301 https://blackdelta.cc$request_uri;
}

